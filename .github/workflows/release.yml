name: Publish installer release

# Pushing a tag v<version> publishes releases/v<version>/* as the GitHub Release for that tag.
# Each release folder holds the versioned installer, a PageFlow-Setup.exe copy and their .sha256
# files, so /releases/latest/download/PageFlow-Setup.exe always serves the newest installer.
# An optional NOTES.md in the folder is added below the fixed release text.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TEXT: |
        Windows installer for the Page-Flow Agent ${{ github.ref_name }}.

        Download **PageFlow-Setup.exe** (same file as the versioned one) and check it against
        its `.sha256`. Signed by DWISE Healthcare IT Solutions Private Limited; see the README
        for the SmartScreen prompt while the certificate builds reputation.
    steps:
      - uses: actions/checkout@v4

      - name: Check the release folder and checksums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          dir="releases/$TAG"
          test -f "$dir/PageFlow-Setup.exe" || { echo "missing $dir/PageFlow-Setup.exe"; exit 1; }
          test -f "$dir/PageFlow-Setup-${TAG#v}.exe" || { echo "missing $dir/PageFlow-Setup-${TAG#v}.exe"; exit 1; }
          cd "$dir"
          for f in *.sha256; do tr -d '\r' < "$f" | sed 's/ \*/  /' | sha256sum -c -; done

      - name: Add the release notes, if any
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes="releases/$TAG/NOTES.md"
          if [ -f "$notes" ]; then
            body="$RUNNER_TEMP/release-body.md"
            { printf '%s\n' "$RELEASE_TEXT"; cat "$notes"; } > "$body"
            echo "path=$body" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Page-Flow Agent ${{ github.ref_name }}
          files: |
            releases/${{ github.ref_name }}/*.exe
            releases/${{ github.ref_name }}/*.sha256
          make_latest: true
          # body_path wins when set; without NOTES.md it is empty and body is used, as before.
          body_path: ${{ steps.notes.outputs.path }}
          body: ${{ env.RELEASE_TEXT }}
